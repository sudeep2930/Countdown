<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <button id="themeToggle" class="theme-btn">🌙</button>
    <button id="soundToggle" class="sound-btn" title="Toggle Sounds">🔊</button>


    <div class="wrap">
        <div class="card">
            <header>
                <h1>COUNTDOWN BEGINS!!</h1>
                <div class="controls">
                    <input id="targetInput" type="datetime-local" />
                    <button id="addCountdownBtn">Add Countdown</button>
                </div>
            </header>


            <div id="countdownList" class="countdown-list"></div>


            <audio id="alarmSound" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-1102.mp3"></audio>
            <audio id="celebrationSound1" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.wav"></audio>
            <audio id="celebrationSound2" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.wav"></audio>
            <audio id="partySound" src="https://assets.mixkit.co/sfx/preview/mixkit-party-horn-712.wav"></audio>
            <audio id="clickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-click-button-1129.wav"></audio>
            <audio id="tickSound" src="https://assets.mixkit.co/sfx/preview/mixkit-tick-tock-clock-1052.wav"></audio>
            <audio id="successSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>
            <audio id="deleteSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.wav"></audio>
            <audio id="pauseSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-show-player-losing-2042.wav"></audio>
            <audio id="resumeSound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-game-jump-coin-216.wav"></audio>
        </div>
    </div>

    <!-- Confetti Container -->
    <div id="confetti-container"></div>


    <script src="script.js"></script>
</body>

</html>
