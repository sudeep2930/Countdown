<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Advanced Countdown Timer</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <button id="themeToggle" class="theme-btn">🌙</button>


    <div class="wrap">
        <div class="card">
            <header>
                <h1>COUNTDOWN BEGINS!!</h1>
                <div class="controls">
                    <input id="targetInput" type="datetime-local" />
                    <button id="addCountdownBtn">Add Countdown</button>
                </div>
            </header>


            <div id="countdownList" class="countdown-list"></div>


            <audio id="alarmSound" src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-1102.mp3"></audio>
        </div>
    </div>


    <script src="script.js"></script>
</body>

</html>
